<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>로컬 Zoom 감지 연결</title>
<style>body{max-width:620px;margin:48px auto;font:16px system-ui;line-height:1.7}label{display:block;margin:16px 0}input{display:block;width:100%;padding:8px;box-sizing:border-box}button{padding:10px 20px}code{overflow-wrap:anywhere}</style>
</head><body>
<h1>로컬 녹음 앱 연결</h1>
<p>이 확장은 회의 가능성만 전달합니다. 녹음은 Windows 앱에서 동의를 확인하고 시작을 눌러야 합니다.</p>
<p>확장 ID: <code id="extensionId"></code><br>이 ID를 앱 설정의 extension_ids에 등록한 후 앱을 다시 실행하세요.</p>
<label>앱의 연결 토큰 <input id="token" type="password" autocomplete="off" spellcheck="false"></label>
<label>로컬 포트 <input id="port" type="number" value="17843" min="1024" max="65535"></label>
<button id="save">이 기기에 저장</button><p id="status" role="status"></p>
<p>토큰은 앱을 다시 실행할 때 바뀝니다. 회의 링크·채팅·참석자 이름은 전송하지 않습니다. 다른 PC와 동기화하지 않습니다.</p>
<script src="options.js"></script>
</body></html>
